<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>たびのこ 更新</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF6E5;color:#3b2a1e;font:16px/1.7 ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;text-align:center;padding:24px}main{max-width:22em}a{color:#a4531f}</style></head>
<body><main><h1 style="font-size:1.2rem">新しい版に入れ替えています…</h1><p id="s">少し待ってね。メモや写真は消えません。</p></main>
<script>
(async () => {
  const s = document.getElementById('s');
  try {
    if (navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    s.textContent = '入れ替えました。開き直します。';
    setTimeout(() => location.replace('./?v=' + Date.now()), 600);
  } catch (e) { s.innerHTML = 'うまくいきませんでした。<a href="./">アプリへ戻る</a>'; }
})();
</script></body></html>
